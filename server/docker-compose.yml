# version: "3.8"
services:
  mysql:
    image: mysql:8.3.0
    container_name: note-mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_LOWER_CASE_TABLE_NAMES=0
    ports:
      - 5200:3306
    volumes:
      - ./data/mysql:/var/lib/mysql
